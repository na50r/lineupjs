    const numericColumns = new Set([
      'itemId',
      'channel_since',
      'upload_consistency',
      'avg_video_length_min',
      'num_editors',
      'num_series',
      'sponsorship_rate',
      'min_video_length_min',
      'max_video_length_min',
      'number_of_videos',
      'audience_rating',
      'production_quality',
      'thumbnail_quality'
    ]);

    function parseCSV(text) {
      const lines = text.trim().split('\n');
      const headers = lines[0].split(',');

      return lines.slice(1).map(line => {
        const values = line.split(',');
        const row = {};

        headers.forEach((header, i) => {
          const value = values[i];
          row[header] = numericColumns.has(header)
            ? Number(value)
            : value;
        });

        return row;
      });
    }

    const data = parseCSV(csvText);

    console.log("Parsed rows:", data.length);
    console.log(data[0]);

    // Create the LineUp table
    const lineup = LineUpJS.asLineUp(
      document.getElementById("lineup"),
      data
    );
